        function normalizeInlineImageUrl(value){
            const url = String(value || '').trim().replace(/^<|>$/g, '');
            if(/^https?:\/\//i.test(url) || url.startsWith('/')) return url;
            return '';
        }

        function chatMediaDisplayUrl(value, name='', provider=''){
            const url = normalizeInlineImageUrl(value);
            if(!url || !/^https?:\/\//i.test(url)) return url;
            const params = new URLSearchParams({url, inline:'1'});
            if(name) params.set('name', name);
            if(provider) params.set('provider_id', provider);
            return `/api/download-output?${params.toString()}`;
        }

        function extractInlineImages(content){
            const imageUrls = [];
            let text = String(content || '');
            text = text.replace(/!\[[^\]]*\]\(\s*([^\s)]+)(?:\s+["'][^"']*["'])?\s*\)/gi, (match, rawUrl) => {
                const url = normalizeInlineImageUrl(rawUrl);
                if(!url) return match;
                imageUrls.push(url);
                return '';
            });
            text = text.replace(/(^|\n)\s*(https?:\/\/[^\s<>]+\.(?:png|jpe?g|webp|gif)(?:\?[^\s<>]*)?)\s*(?=\n|$)/gi, (match, prefix, rawUrl) => {
                const url = normalizeInlineImageUrl(rawUrl);
                if(!url) return match;
                imageUrls.push(url);
                return prefix;
            });
            return {
                text: text.replace(/\n{3,}/g, '\n\n').trim(),
                imageUrls: [...new Set(imageUrls)]
            };
        }

        function inspirationShareContext(msg, context={}){
            const messages = Array.isArray(context.messages) ? context.messages : [];
            const index = Number.isInteger(context.index) ? context.index : messages.indexOf(msg);
            let prompt = String(msg.prompt || msg.input_prompt || msg.original_prompt || '').trim();
            // 只记录生成时真正使用的输入参考图；生成结果本身永远不进入同款参考图。
            let referenceImages = Array.isArray(msg.used_references) ? msg.used_references.filter(isImageRef) : [];
            if(index >= 0){
                for(let cursor=index - 1; cursor >= 0; cursor--){
                    const candidate = messages[cursor];
                    if(candidate?.role !== 'user') continue;
                    if(!prompt) prompt = String(candidate.content || candidate.prompt || '').trim();
                    if(!referenceImages.length && Array.isArray(candidate.attachments)) {
                        referenceImages = candidate.attachments.filter(isImageRef);
                    }
                    break;
                }
            }
            return {
                prompt,
                reference_images:referenceImages.slice(0,8).map(ref => ({
                    url:String(ref.url || ''),
                    name:String(ref.name || attachmentName(ref) || '参考图'),
                    kind:'image',
                    mime:String(ref.mime || ''),
                })).filter(ref => ref.url),
                conversation_id:String(currentConversation?.id || ''),
                model:String(msg.model || ''),
                provider:String(msg.provider || ''),
            };
        }

        function sourceUserMessageForImage(msg, context={}){
            const messages = Array.isArray(context.messages) ? context.messages : (currentConversation?.messages || []);
            const index = Number.isInteger(context.index) ? context.index : messages.indexOf(msg);
            const start = index >= 0 ? index - 1 : messages.length - 1;
            const requestId = String(msg?.request_id || '');
            if(requestId){
                for(let cursor=start; cursor >= 0; cursor--){
                    const candidate = messages[cursor];
                    if(candidate?.role === 'user' && String(candidate.request_id || '') === requestId) return candidate;
                }
            }
            for(let cursor=start; cursor >= 0; cursor--){
                if(messages[cursor]?.role === 'user') return messages[cursor];
            }
            return null;
        }

        function imageRegenerationRequest(msg, context={}){
            const source = sourceUserMessageForImage(msg, context);
            const message = String(source?.content || source?.prompt || '').trim();
            if(!message) return null;
            const requestContext = source?.request_context && typeof source.request_context === 'object'
                ? source.request_context
                : {};
            const references = (Array.isArray(source?.attachments) && source.attachments.length
                ? source.attachments
                : (Array.isArray(msg?.used_references) ? msg.used_references : [])).slice(0, CHAT_ATTACHMENT_MAX);
            const imageProvider = String(requestContext.image_provider || msg?.provider || activeImageProvider || '');
            const imageModel = String(requestContext.image_model || msg?.model || activeImageModel || config.image_model || '');
            const rawCount = Number(requestContext.requested_count || msg?.image_count || 1);
            const restoredCount = Math.min(4, Math.max(1, Number.isFinite(rawCount) ? Math.round(rawCount) : 1));
            const generationPrompt = String(requestContext.generation_prompt || '').trim();
            const action = String(requestContext.action || msg?.agent_action || '').trim();
            const savedPlan = requestContext.agent_plan && typeof requestContext.agent_plan === 'object'
                ? requestContext.agent_plan
                : (msg?.design_plan && typeof msg.design_plan === 'object' ? msg.design_plan : {});
            const agentPlan = {...savedPlan};
            if(generationPrompt) agentPlan.generation_prompt = generationPrompt;
            if(!agentPlan.route) agentPlan.route = action === 'edit_image' ? 'edit_image' : 'direct_generate';
            return {
                message,
                references,
                size:String(requestContext.size || msg?.size || currentChatSize()),
                requestOptions:{
                    sizeIsExplicit:requestContext.size_is_explicit === true,
                    mode:'image',
                    provider:imageProvider,
                    msModel:'',
                    chatModel:activeChatModel || config.chat_model,
                    imageProvider,
                    imageModel,
                    imageCount:restoredCount,
                    quality:String(requestContext.quality || 'auto'),
                    systemPrompt:'',
                    agentPlan,
                },
            };
        }

        function imageRegenerateKey(msg, context={}){
            const source = sourceUserMessageForImage(msg, context);
            return String(msg?.request_id || msg?.id || source?.request_id || source?.id || '');
        }

        function setImageRegenerateBusy(key, busy){
            document.querySelectorAll('.generated-regenerate').forEach(button => {
                if(button.dataset.regenerateKey !== key) return;
                button.disabled = busy;
                button.setAttribute('aria-busy', String(busy));
                button.title = busy ? '正在重新生成' : '重新生成';
                button.innerHTML = busy ? '<i data-lucide="loader-circle"></i>' : '<i data-lucide="rotate-ccw"></i>';
            });
            lucide.createIcons();
        }

        async function regenerateImageMessage(msg, context={}){
            const regeneration = imageRegenerationRequest(msg, context);
            const key = imageRegenerateKey(msg, context);
            if(!regeneration || !key || activeRegenerateKeys.has(key)) return;
            activeRegenerateKeys.add(key);
            setImageRegenerateBusy(key, true);
            try {
                await sendMessage(regeneration);
            } finally {
                activeRegenerateKeys.delete(key);
                setImageRegenerateBusy(key, false);
            }
        }

        function addMessageBubble(msg, context={}){
            const box = document.getElementById('messages');
            const row = document.createElement('div');
            row.className = `bubble-row ${msg.role === 'user' ? 'user' : 'assistant'}`;
            if(msg.request_id) row.dataset.requestId = String(msg.request_id);
            const bubble = document.createElement('div');
            bubble.className = `bubble ${msg.role === 'user' ? 'user' : 'assistant'}`;
            const rawText = msg.type === 'image' ? (msg.agent_reply || tr('chat.generated')) : (msg.content || '');
            const inlineContent = extractInlineImages(rawText);
            const storedImageUrls = Array.isArray(msg.image_urls) && msg.image_urls.length ? msg.image_urls : (msg.image_url ? [msg.image_url] : []);
            const imageUrls = [...new Set([...storedImageUrls, ...inlineContent.imageUrls].map(normalizeInlineImageUrl).filter(Boolean))];
            if(imageUrls.length) bubble.classList.add('image-bubble');
            const text = document.createElement('div');
            text.textContent = inlineContent.text;
            text.className = 'bubble-text';
            bubble.appendChild(text);
            if(msg.role === 'assistant' && msg.type === 'error' && msg.status === 'failed'){
                const original = imageRegenerationRequest(msg, context);
                if(original){
                    const edit = document.createElement('button');
                    edit.type = 'button';
                    edit.className = 'text-xs underline mt-2';
                    edit.textContent = '载入原资料，调整后重试';
                    edit.onclick = () => {
                        const input = document.getElementById('messageInput');
                        if(input.value.trim() || refs.length){
                            alert('输入框已有草稿，请先处理当前草稿。');
                            return;
                        }
                        input.value = original.message;
                        refs = original.references.slice();
                        const [width,height] = original.size.split('x').map(Number);
                        if(original.requestOptions.sizeIsExplicit){
                            drawingSize = {width,height,referenceUrls:refs.map(ref => ref.url)};
                            drawingSizeActive = true;
                        }
                        activeImageProvider = original.requestOptions.imageProvider;
                        activeImageModel = original.requestOptions.imageModel;
                        setImageCount(original.requestOptions.imageCount, false);
                        setMode('image');
                        renderRefs();
                        renderModelPicker();
                        autoGrow(input);
                    };
                    bubble.appendChild(edit);
                }
            }
            if(msg.attachments?.length){
                const thumbs = document.createElement('div');
                thumbs.className = 'thumbs';
                msg.attachments.forEach(ref => {
                    const thumb = renderAttachmentThumb(ref);
                    thumbs.appendChild(thumb);
                });
                bubble.appendChild(thumbs);
            }
            if(imageUrls.length){
                const grid = document.createElement('div');
                grid.className = `generated-grid count-${Math.min(imageUrls.length, 4)}`;
                const shareContext = inspirationShareContext(msg, context);
                const regeneration = msg.role === 'assistant' && msg.type === 'image'
                    ? imageRegenerationRequest(msg, context)
                    : null;
                const regenerateKey = regeneration ? imageRegenerateKey(msg, context) : '';
                imageUrls.forEach((url, index) => {
                    const item = document.createElement('div');
                    item.className = 'generated-item is-loading';
                    const img = document.createElement('img');
                    img.className = 'generated';
                    img.alt = '生成图片';
                    img.loading = context.eagerImages ? 'eager' : 'lazy';
                    img.decoding = 'async';
                    const displayUrl = chatMediaDisplayUrl(url, generatedImageDownloadName(url, index), msg.provider);
                    const loadError = document.createElement('div');
                    loadError.className = 'generated-load-error';
                    loadError.textContent = '图片加载失败，可点击下载稍后重试';
                    img.addEventListener('load', () => {
                        item.classList.remove('is-loading', 'load-failed');
                        if(context.eagerImages) scrollBottom();
                    }, {once:true});
                    img.addEventListener('error', () => {
                        item.classList.remove('is-loading');
                        item.classList.add('load-failed');
                    }, {once:true});
                    img.src = displayUrl;
                    img.onclick = () => openImagePreview(url, msg.provider);
                    const download = document.createElement('button');
                    download.type = 'button';
                    download.className = 'generated-download';
                    download.title = '下载图片';
                    download.setAttribute('aria-label', `下载第 ${index + 1} 张图片`);
                    download.innerHTML = '<i data-lucide="download"></i>';
                    download.onclick = event => {
                        event.stopPropagation();
                        downloadGeneratedImage(url, index, msg.provider);
                    };
                    const share = document.createElement('button');
                    share.type = 'button';
                    share.className = 'generated-share';
                    share.title = '分享到灵感广场';
                    share.setAttribute('aria-label', `分享第 ${index + 1} 张图片到灵感广场`);
                    share.innerHTML = '<i data-lucide="share-2"></i>';
                    share.onclick = event => {
                        event.stopPropagation();
                        openInspirationShare(url, shareContext);
                    };
                    if(regeneration && regenerateKey){
                        const regenerate = document.createElement('button');
                        regenerate.type = 'button';
                        regenerate.className = 'generated-regenerate';
                        regenerate.dataset.regenerateKey = regenerateKey;
                        regenerate.title = activeRegenerateKeys.has(regenerateKey) ? '正在重新生成' : '重新生成';
                        regenerate.setAttribute('aria-label', '使用原需求重新生成');
                        regenerate.setAttribute('aria-busy', String(activeRegenerateKeys.has(regenerateKey)));
                        regenerate.disabled = activeRegenerateKeys.has(regenerateKey);
                        regenerate.innerHTML = regenerate.disabled
                            ? '<i data-lucide="loader-circle"></i>'
                            : '<i data-lucide="rotate-ccw"></i>';
                        regenerate.onclick = event => {
                            event.stopPropagation();
                            regenerateImageMessage(msg, context);
                        };
                        item.append(img, loadError, regenerate, share, download);
                    } else {
                        item.append(img, loadError, share, download);
                    }
                    const annotate = document.createElement('button');
                    annotate.type = 'button';
                    annotate.className = 'generated-share generated-annotate';
                    annotate.title = '发送到绘画标注';
                    annotate.setAttribute('aria-label', `将第 ${index + 1} 张图片发送到绘画标注`);
                    annotate.innerHTML = '<i data-lucide="pencil"></i>';
                    annotate.onclick = event => {
                        event.stopPropagation();
                        sendImageToDrawing(annotate, displayUrl, generatedImageDownloadName(url, index));
                    };
                    item.appendChild(annotate);
                    grid.appendChild(item);
                });
                bubble.appendChild(grid);
            }
            // Show model badge for assistant messages
            if(msg.role === 'assistant' && msg.model){
                const badge = document.createElement('div');
                const modelShort = msg.model.split('/').pop().split(':')[0];
                const isMs = msg.model.includes('/') && !msg.model.includes('gpt');
                badge.style.cssText = `margin-top:8px;font-size:9px;font-weight:700;opacity:.45;letter-spacing:.06em;`;
                badge.textContent = modelShort;
                bubble.appendChild(badge);
            }
            row.appendChild(bubble);
            box.appendChild(row);
            lucide.createIcons();
            return {row, bubble, text};
        }

        function generatedImageDownloadName(url, index=0){
            const path = String(url || '').split(/[?#]/)[0];
            let name = '';
            try { name = decodeURIComponent(path.split('/').pop() || ''); } catch(e) {}
            name = name.replace(/[^\w.\-\u4e00-\u9fff]+/g, '-').replace(/^-+|-+$/g, '');
            if(!/\.(?:png|jpe?g|webp|gif|bmp|tiff?)$/i.test(name)) name = `生成图片-${index + 1}.png`;
            return name;
        }

        function downloadGeneratedImage(url, index=0, provider=''){
            if(!url) return;
            const name = generatedImageDownloadName(url, index);
            const link = document.createElement('a');
            const params = new URLSearchParams({url, name});
            if(provider) params.set('provider_id', provider);
            link.href = `/api/download-output?${params.toString()}`;
            link.download = name;
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        const pendingDrawingTransfers = new Map();

        function finishDrawingTransfer(requestId, ok, message=''){
            const pending = pendingDrawingTransfers.get(requestId);
            if(!pending) return;
            clearTimeout(pending.timeout);
            pendingDrawingTransfers.delete(requestId);
            pending.button.disabled = false;
            pending.button.setAttribute('aria-busy', 'false');
            pending.button.title = '发送到绘画标注';
            pending.button.innerHTML = '<i data-lucide="pencil"></i>';
            if(!ok){
                const status = document.createElement('div');
                status.className = 'generated-annotation-status';
                status.setAttribute('role', 'alert');
                status.textContent = message || '图片导入失败，请重试';
                pending.button.parentElement?.appendChild(status);
            }
            lucide.createIcons();
        }

        function sendImageToDrawing(button, sourceUrl, filename){
            if(button.disabled) return;
            button.parentElement?.querySelector('.generated-annotation-status')?.remove();
            const requestId = uuid();
            button.disabled = true;
            button.setAttribute('aria-busy', 'true');
            button.title = '正在发送到绘画标注…';
            button.innerHTML = '<i data-lucide="loader-circle"></i>';
            const timeout = setTimeout(() => finishDrawingTransfer(requestId, false, '导入超时，请重试'), 90000);
            pendingDrawingTransfers.set(requestId, {button, timeout});
            lucide.createIcons();
            if(window.parent === window){
                finishDrawingTransfer(requestId, false, '请从灵绘工作台打开创意生图后使用');
                return;
            }
            window.parent.postMessage({type:'lingdraw:open-drawing', requestId, sourceUrl, filename}, location.origin);
        }

        window.addEventListener('message', event => {
            if(event.origin !== location.origin || event.source !== window.parent) return;
            if(event.data?.type === 'lingdraw:drawing-import-result') {
                finishDrawingTransfer(event.data.requestId, event.data.ok === true, event.data.message);
            }
        });

        function selectInspirationCategory(category){
            if(!inspirationShareDraft) return;
            inspirationShareDraft.category = category;
            document.querySelectorAll('[data-inspiration-category]').forEach(button => {
                const active = button.dataset.inspirationCategory === category;
                button.classList.toggle('active', active);
                button.setAttribute('aria-checked', active ? 'true' : 'false');
            });
        }

        function openInspirationShare(imageUrl, context={}){
            const modal = document.getElementById('inspirationShareModal');
            if(!modal || !imageUrl) return;
            inspirationShareDraft = {
                image_url:imageUrl,
                prompt:String(context.prompt || '').trim(),
                reference_images:Array.isArray(context.reference_images) ? context.reference_images : [],
                conversation_id:String(context.conversation_id || ''),
                model:String(context.model || ''),
                category:'创意',
            };
            inspirationShareBusy = false;
            document.getElementById('inspirationShareImage').src = chatMediaDisplayUrl(imageUrl, 'inspiration-preview', context.provider);
            document.getElementById('inspirationSharePrompt').textContent = inspirationShareDraft.prompt || '这张图片暂未读取到提示词';
            const referenceCount = inspirationShareDraft.reference_images.length;
            document.getElementById('inspirationShareReferenceCount').textContent = referenceCount ? `包含 ${referenceCount} 张参考图` : '未包含参考图';
            const status = document.getElementById('inspirationShareStatus');
            status.textContent = '分享后可在侧栏“灵感广场”中查看。';
            status.classList.remove('error');
            const confirm = document.getElementById('inspirationShareConfirm');
            confirm.disabled = false;
            confirm.textContent = '分享';
            selectInspirationCategory('创意');
            modal.classList.add('open');
            lucide.createIcons();
        }

        function closeInspirationShare(){
            if(inspirationShareBusy) return;
            document.getElementById('inspirationShareModal')?.classList.remove('open');
            const image = document.getElementById('inspirationShareImage');
            if(image) image.src = '';
            inspirationShareDraft = null;
        }

        async function confirmInspirationShare(){
            if(!inspirationShareDraft || inspirationShareBusy) return;
            inspirationShareBusy = true;
            const confirm = document.getElementById('inspirationShareConfirm');
            const status = document.getElementById('inspirationShareStatus');
            confirm.disabled = true;
            confirm.textContent = '分享中…';
            status.textContent = '正在发布作品与提示词…';
            status.classList.remove('error');
            try {
                const response = await fetch('/api/inspirations', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(inspirationShareDraft),
                });
                const data = await response.json();
                if(!response.ok) throw new Error(data.detail || '分享失败');
                status.textContent = `已分享到“${inspirationShareDraft.category}”分类`;
                confirm.textContent = '已分享';
                window.parent.postMessage({type:'lingdraw:inspiration-shared',item:data.item}, location.origin);
                window.setTimeout(() => {
                    inspirationShareBusy = false;
                    closeInspirationShare();
                }, 720);
            } catch(err) {
                inspirationShareBusy = false;
                confirm.disabled = false;
                confirm.textContent = '重试分享';
                status.textContent = err.message || '分享失败，请稍后重试';
                status.classList.add('error');
            }
        }

        const importedCanvases = new Set();
        let focusImportedCanvas = false;
        window.addEventListener('message', event => {
            if(event.origin !== location.origin || event.source !== window.parent) return;
            if(event.data?.type === 'studio-activate' && focusImportedCanvas) {
                focusImportedCanvas = false;
                updateComposerOverflow();
                document.getElementById('messageInput')?.focus();
            }
            if(event.data?.type !== 'lingdraw:import-canvas') return;
            const {requestId} = event.data;
            if(typeof requestId !== 'string' || !requestId || requestId.length > 100) return;
            let result;
            try {
                if(!importedCanvases.has(requestId)) {
                    const payload = LingDrawDrawingHandoff.validate(event.data, location.origin);
                    const input = document.getElementById('messageInput');
                    const draft = LingDrawDrawingHandoff.mergeDraft(refs, input.value, payload, CHAT_ATTACHMENT_MAX);
                    refs = draft.refs;
                    input.value = draft.prompt;
                    applyDrawingSize(payload);
                    renderRefs();
                    setMode('image');
                    importedCanvases.add(requestId);
                    if(importedCanvases.size > 100) importedCanvases.delete(importedCanvases.values().next().value);
                }
                focusImportedCanvas = true;
                result = {ok:true};
            } catch(error) { result = {ok:false, message:error.message || '画布导入失败，请重试'}; }
            window.parent.postMessage({type:'lingdraw:chat-import-result',requestId,...result}, location.origin);
        });

        function applyInspirationRemix(payload){
            const incomingReferences = Array.isArray(payload.reference_images) ? payload.reference_images : [];
            // 一键同款只还原原始输入，绝不把灵感成品图作为新的参考图。
            const candidates = incomingReferences.map((ref,index) => ({
                url:String(ref?.url || ''),
                name:String(ref?.name || `参考图 ${index + 1}`),
                kind:'image',
            })).filter(ref => ref.url);
            const seen = new Set();
            refs = candidates.filter(ref => {
                if(seen.has(ref.url)) return false;
                seen.add(ref.url);
                return true;
            }).slice(0, CHAT_ATTACHMENT_MAX);
            renderRefs();
            setMode('image');
            const input = document.getElementById('messageInput');
            const prompt = String(payload.prompt || '').trim();
            if(input){
                input.value = prompt;
                autoGrow(input);
            }
            input?.focus();
        }

        function openImagePreview(url, provider=''){
            const modal = document.getElementById('imagePreviewModal');
            const img = document.getElementById('imagePreviewImg');
            if(!modal || !img || !url) return;
            img.src = chatMediaDisplayUrl(url, 'image-preview', provider);
            modal.classList.add('open');
            lucide.createIcons();
        }

        function closeImagePreview(){
            const modal = document.getElementById('imagePreviewModal');
            const img = document.getElementById('imagePreviewImg');
            modal?.classList.remove('open');
            if(img) img.src = '';
        }

        function isImageRef(ref){
            const kind = String(ref?.kind || '').toLowerCase();
            const mime = String(ref?.mime || '').toLowerCase();
            const url = String(ref?.url || '').toLowerCase();
            return kind === 'image' || mime.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|tiff?)(\?|#|$)/.test(url);
        }

        function attachmentName(ref){
            return ref?.name || (ref?.url || '').split('/').pop() || '附件';
        }

        function renderAttachmentThumb(ref){
            if(isImageRef(ref)){
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = ref.url;
                img.title = attachmentName(ref);
                img.onclick = () => openImagePreview(ref.url);
                return img;
            }
            const node = document.createElement('div');
            node.className = 'thumb file-thumb';
            node.title = attachmentName(ref);
            node.innerHTML = `<i data-lucide="file"></i><span class="thumb-name">${escapeHtml(attachmentName(ref))}</span>`;
            return node;
        }

        function renderRefChip(ref, i){
            if(isImageRef(ref)){
                const label = ref.role === 'annotation' ? '标注说明' : ref.annotation_group ? '原图' : ref.role === 'sketch' ? '草图' : '';
                const removeLabel = ref.annotation_group ? '移除原图和标注说明图' : '移除附件';
                return `<div class="ref-chip${label ? ' drawing-reference' : ''}"><img src="${escapeHtml(ref.url)}" alt="${escapeHtml(label || attachmentName(ref))}" title="${escapeHtml(attachmentName(ref))}">${label ? `<span class="ref-role">${label}</span>` : ''}<button aria-label="${removeLabel}" title="${removeLabel}" onclick="removeRef(${i})">×</button></div>`;
            }
            return `<div class="ref-chip file"><i data-lucide="file"></i><span class="ref-file-name" title="${escapeHtml(attachmentName(ref))}">${escapeHtml(attachmentName(ref))}</span><button onclick="removeRef(${i})">×</button></div>`;
        }

        async function uploadFiles(files){
            if(!files?.length) return;
            const available = Math.max(0, CHAT_ATTACHMENT_MAX - refs.length);
            if(!available) return;
            try {
                const selected = [...files].slice(0, available);
                const prepared = window.LingDrawImageUpload
                    ? await window.LingDrawImageUpload.optimizeFiles(selected)
                    : selected;
                const form = new FormData();
                prepared.forEach(file => form.append('files', file));
                const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || '上传失败'); return r.json(); });
                refs.push(...(data.files || []));
                renderRefs();
            } catch(e) {
                alert(e.message || '上传失败');
            }
        }

        function renderRefs(){
            const strip = document.getElementById('refStrip');
            strip.innerHTML = refs.map((ref,i) => renderRefChip(ref, i)).join('');
            lucide.createIcons();
            updateComposerOverflow();
            updateChatResolutionUI();
        }

        function removeRef(i){ refs = LingDrawDrawingHandoff.removeReference(refs, i); renderRefs(); }

        window.addEventListener('paste', e => {
            const files = [...(e.clipboardData?.items || [])].filter(x => x.kind === 'file').map(x => x.getAsFile()).filter(Boolean);
            if(files.length) uploadFiles(files);
        });

        const composerBody = document.getElementById('composerBody');
        composerBody.addEventListener('dragover', e => {
            if(!hasUploadFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBody.classList.add('drag-over');
        });
        composerBody.addEventListener('dragleave', e => {
            if(!composerBody.contains(e.relatedTarget)) composerBody.classList.remove('drag-over');
        });
        composerBody.addEventListener('drop', e => {
            if(!hasUploadFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBody.classList.remove('drag-over');
            const files = [...(e.dataTransfer?.files || [])];
            uploadFiles(files);
        });

        function hasUploadFiles(items){ return [...(items || [])].some(item => item.kind === 'file'); }
        function updateComposerOverflow(){
            const body = document.getElementById('composerBody');
            if(!body) return;
            body.classList.toggle('has-overflow', body.scrollHeight > body.clientHeight + 2);
        }
        function autoGrow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 150) + 'px'; updateComposerOverflow(); }
        function handleKey(e){
            if(e.isComposing || e.repeat) return;
            if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
        }
        window.addEventListener('keydown', e => {
            if(e.key === 'Escape') {
                closeImagePreview();
                closeInspirationShare();
            }
        });

        function showRequestResult(data, assistantBubble, conversationId){
            if(!data?.conversation || currentConversation?.id !== conversationId) return;
            currentConversation = data.conversation;
            rememberConversation(currentConversation.id);
            setChatTitle(currentConversation.title);
            // Use the same durable render path as a page refresh. This avoids a
            // zero-height lazy image row when a long prompt pushes the result
            // below the current viewport.
            renderConversationState(currentConversation);
        }

        async function sendMessage(overrides=null){
            const input = document.getElementById('messageInput');
            const isRegeneration = Boolean(overrides);
            const message = String(overrides?.message ?? input.value).trim();
            if(!message) return;
            const pendingRefs = Array.isArray(overrides?.references) ? overrides.references.slice() : refs.slice();
            const requestedSize = String(overrides?.size || chatSizeFromPrompt(message));
            const pendingDrawingSize = !isRegeneration && drawingSize ? {...drawingSize, active:drawingSizeActive} : null;
            const defaultRequestOptions = {
                sizeIsExplicit:!isRegeneration && hasExplicitChatSize(),
                mode,
                provider,
                msModel: provider === 'modelscope' ? (msModel || activeChatModel || (config.ms_chat_models?.[0] || '')) : '',
                chatModel: activeChatModel || config.chat_model,
                imageProvider: activeImageProvider,
                imageModel: activeImageModel || config.image_model,
                imageCount,
                quality:'auto',
                systemPrompt: currentSystemPrompt(),
                agentPlan:{},
            };
            const requestOptions = {...defaultRequestOptions, ...(overrides?.requestOptions || {})};
            const sendKey = sendFingerprint(currentConversation?.id || '', message, pendingRefs, requestedSize, requestOptions);
            const pendingDuplicate = requestOptions.mode !== 'chat' && pendingRequestRecords().find(record =>
                ChatRequestRecovery.matches(record, currentConversation?.id || '', sendKey, message, pendingRefs));
            if(activeSendKeys.has(sendKey) || pendingDuplicate){
                if(!isRegeneration){
                    input.placeholder = '相同任务正在处理中，请勿重复发送';
                    autoGrow(input);
                    window.setTimeout(() => { input.placeholder = tr('chat.inputPlaceholder'); }, 1500);
                }
                renderRecoveryNotices();
                return;
            }

            const requestId = createChatRequestId();
            activeSendKeys.add(sendKey);
            if(!isRegeneration){
                document.getElementById('composerError').classList.add('hidden');
                refs = [];
                renderRefs();
                input.value = '';
                autoGrow(input);
            }

            let conversationId = '';
            let assistantBubble = null;
            let submitted = false;
            let recoverOriginal = false;
            try {
                const requestConversation = await ensureConversationForSend();
                conversationId = requestConversation.id;
                const useStreaming = requestOptions.mode === 'chat';
                const pendingText = requestOptions.mode === 'image'
                    ? tr('chat.generatingImage')
                    : (useStreaming ? '' : (requestOptions.mode === 'agent' ? tr('chat.agentWorking') : ''));
                activeRequests.set(requestId, {
                    conversationId,
                    sendKey,
                    message,
                    attachments:pendingRefs,
                    mode:requestOptions.mode,
                    pendingText,
                });
                syncSendBusyState();
                if(requestOptions.mode !== 'chat'){
                    persistPendingRequest({
                        requestId,
                        conversationId,
                        mode:requestOptions.mode,
                        message,
                        attachments:pendingRefs,
                        pendingText,
                        createdAt:Date.now(),
                        sendKey:sendFingerprint(conversationId, message, pendingRefs, requestedSize, requestOptions),
                        requestedSize,
                        requestOptions,
                        drawingSize:pendingDrawingSize,
                    });
                }

                if(currentConversation?.id === conversationId){
                    addMessageBubble({role:'user', content:message, attachments:pendingRefs, request_id:requestId});
                    assistantBubble = addMessageBubble({role:'assistant', content:pendingText, request_id:requestId});
                    assistantBubble.bubble.classList.add('streaming');
                    scrollBottom();
                }

                if(requestOptions.mode === 'chat') {
                    const data = await streamChatMessage(message, pendingRefs, assistantBubble, {
                        conversationId,
                        requestId,
                        requestedSize,
                        ...requestOptions,
                    });
                    if(data?.conversation && currentConversation?.id === conversationId){
                        currentConversation = data.conversation;
                        rememberConversation(currentConversation.id);
                        setChatTitle(currentConversation.title);
                    }
                } else if(requestOptions.mode === 'agent') {
                    submitted = true;
                    const data = await fetch('/api/chat/agent', {
                        method:'POST',
                        headers:headers(),
                        body:JSON.stringify({
                            conversation_id:conversationId,
                            request_id: requestId,
                            surface:'gpt_chat',
                            context_id:'',
                            message,
                            system_prompt:requestOptions.systemPrompt,
                            mode:'agent',
                            size:requestedSize,
                            size_is_explicit:requestOptions.sizeIsExplicit,
                            model:requestOptions.provider === 'modelscope' ? requestOptions.msModel : requestOptions.chatModel,
                            ms_model:requestOptions.provider === 'modelscope' ? requestOptions.msModel : '',
                            image_model:requestOptions.imageModel,
                            image_count:requestOptions.imageCount,
                            quality:requestOptions.quality,
                            agent_plan:requestOptions.agentPlan,
                            reference_images:pendingRefs,
                            provider:requestOptions.provider,
                            image_provider:requestOptions.imageProvider,
                        })
                    }).then(ChatRequestRecovery.readResponse);
                    if(!data.conversation || !data.message) throw new Error('暂未取得完整结果');
                    removePendingRequest(requestId);
                    clearRequestError(requestId);
                    showRequestResult(data, assistantBubble, conversationId);
                } else {
                    submitted = true;
                    const data = await fetch('/api/chat/agent', {
                        method:'POST',
                        headers:headers(),
                        body:JSON.stringify({
                            conversation_id:conversationId,
                            request_id: requestId,
                            surface:'gpt_chat',
                            context_id:'',
                            message,
                            system_prompt:requestOptions.systemPrompt,
                            mode:requestOptions.mode,
                            size:requestedSize,
                            size_is_explicit:requestOptions.sizeIsExplicit,
                            model:requestOptions.chatModel,
                            image_model:requestOptions.imageModel,
                            image_count:requestOptions.imageCount,
                            quality:requestOptions.quality,
                            agent_plan:requestOptions.agentPlan,
                            reference_images:pendingRefs,
                            provider:requestOptions.imageProvider,
                            image_provider:requestOptions.imageProvider,
                        })
                    }).then(ChatRequestRecovery.readResponse);
                    if(!data.conversation || !data.message) throw new Error('暂未取得完整结果');
                    removePendingRequest(requestId);
                    clearRequestError(requestId);
                    showRequestResult(data, assistantBubble, conversationId);
                }
            } catch(err) {
                if(requestOptions.mode !== 'chat' && submitted && !ChatRequestRecovery.definitiveFailure(err)){
                    const record = pendingRequestRecords().find(item => item.requestId === requestId);
                    if(record){
                        const blocked = [401,403].includes(err.httpStatus);
                        recoverOriginal = !blocked;
                        try { persistPendingRequest({...record, recoveryState:blocked ? 'paused' : 'querying',
                            recoveryNotice:blocked ? (err.httpStatus === 401 ? '登录已失效，请登录后继续查询原任务' : '无权访问此任务，请确认当前账号')
                                : '连接中断，正在查询生成结果'}); } catch(_) { /* Original receipt remains available. */ }
                        clearRequestError(requestId);
                        if(assistantBubble?.row?.isConnected) assistantBubble.text.textContent = '连接中断，原任务已保留，请查看下方查询状态';
                        return;
                    }
                }
                removePendingRequest(requestId);
                const errorNotice = document.getElementById('composerError');
                errorNotice.dataset.requestId = requestId;
                errorNotice.textContent = err.message || tr('chat.requestFailed');
                errorNotice.classList.remove('hidden');
                // Failed image requests remain editable without discarding a newer draft.
                const restoreImageDraft = () => {
                    if(input.value.trim() || refs.length) return false;
                    input.value = message;
                    refs = pendingRefs.slice();
                    const [width,height] = requestedSize.split('x').map(Number);
                    if(requestOptions.sizeIsExplicit) {
                        drawingSize = pendingDrawingSize || {width,height,referenceUrls:pendingRefs.map(ref => ref.url)};
                        drawingSizeActive = pendingDrawingSize?.active ?? true;
                    }
                    renderRefs();
                    autoGrow(input);
                    return true;
                };
                if(assistantBubble?.row?.isConnected){
                    assistantBubble.bubble.classList.remove('streaming');
                    assistantBubble.text.textContent = err.message || tr('chat.requestFailed');
                } else if(requestOptions.mode === 'chat' && !isRegeneration && !conversationId && !input.value.trim()) {
                    input.value = message;
                    refs = [...pendingRefs, ...refs].slice(0, CHAT_ATTACHMENT_MAX);
                    renderRefs();
                    autoGrow(input);
                }
                if(requestOptions.mode !== 'chat' && !restoreImageDraft()){
                    const edit = document.createElement('button');
                    edit.className = 'text-xs underline mt-2';
                    edit.textContent = '载入失败任务，调整后重试';
                    edit.onclick = () => { if(!restoreImageDraft()) alert('输入框已有草稿，请先处理当前草稿。'); };
                    errorNotice.appendChild(edit);
                }
            } finally {
                activeRequests.delete(requestId);
                activeSendKeys.delete(sendKey);
                syncSendBusyState();
                renderRecoveryNotices();
                if(recoverOriginal){
                    const record = pendingRequestRecords().find(item => item.requestId === requestId);
                    if(record) void resumePendingRequest(record);
                }
                if(conversationId){
                    try { await refreshConversationAfterRequests(conversationId); }
                    catch(e) { await loadConversations().catch(() => {}); }
                }
                scrollBottom();
            }
        }

        async function streamChatMessage(message, pendingRefs, assistantBubble, requestOptions){
            const res = await fetch('/api/chat/stream', {
                method:'POST',
                headers:headers(),
                body:JSON.stringify({
                    conversation_id:requestOptions.conversationId,
                    request_id: requestOptions.requestId,
                    surface:'gpt_chat',
                    context_id:'',
                    message,
                    system_prompt:requestOptions.systemPrompt,
                    mode:'chat',
                    size:requestOptions.requestedSize,
                    model:requestOptions.provider === 'modelscope' ? requestOptions.msModel : requestOptions.chatModel,
                    ms_model:requestOptions.provider === 'modelscope' ? requestOptions.msModel : '',
                    provider:requestOptions.provider,
                    reference_images:pendingRefs,
                })
            });
            if(!res.ok){
                const data = await res.json();
                throw new Error(typeof data.detail === 'string' ? data.detail : (data.detail?.message || tr('chat.requestFailed')));
            }
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';
            let completed = null;
            while(true){
                const {value, done} = await reader.read();
                if(done) break;
                buffer += decoder.decode(value, {stream:true});
                const events = buffer.split('\n\n');
                buffer = events.pop() || '';
                for(const eventText of events){
                    const line = eventText.split('\n').find(item => item.startsWith('data:'));
                    if(!line) continue;
                    const event = JSON.parse(line.slice(5).trim());
                    if(event.type === 'meta' && currentConversation?.id === requestOptions.conversationId){
                        rememberConversation(requestOptions.conversationId);
                        setChatTitle(event.conversation?.title || currentConversation.title);
                    }
                    if(event.type === 'delta'){
                        fullText += event.delta || '';
                        if(assistantBubble?.text) assistantBubble.text.textContent = fullText;
                        scrollBottom();
                    }
                    if(event.type === 'error') throw new Error(event.detail || tr('chat.requestFailed'));
                    if(event.type === 'done') completed = event;
                }
            }
            assistantBubble?.bubble?.classList.remove('streaming');
            return completed;
        }

        function scrollBottom(){ requestAnimationFrame(() => { const box = document.getElementById('messages'); box.scrollTop = box.scrollHeight; }); }
        function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

        window.onload = async () => {
            applyLanguage();
            syncSystemPromptUI();
            setChatRatio(chatRatio);
            setChatResolution(chatResolution);
            setImageCount(imageCount, false);
            await loadConfig();
            await loadConversations();
            resumePendingRequests();
            updateComposerOverflow();
            window.parent.postMessage({type:'lingdraw:chat-ready'}, location.origin);
        };
    </script>
