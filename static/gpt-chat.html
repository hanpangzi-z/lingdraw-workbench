                                                        <button id="chat-ratio-landscape43" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('landscape43')"><span>4:3</span><small>横图</small></button>
                                                        <button id="chat-ratio-story" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('story')"><span>9:16</span><small>竖屏</small></button>

                                                    </div>

                                                        <button type="button" class="resolution-picker-option" data-resolution="1k" onclick="selectResolutionPreset('1k')"><span>1K</span><small id="resolutionPreset1k">1024x1024</small></button>
                                                        <button type="button" class="resolution-picker-option" data-resolution="2k" onclick="selectResolutionPreset('2k')"><span>2K</span><small id="resolutionPreset2k">1536x1536</small></button>
                                                        <button type="button" class="resolution-picker-option" data-resolution="4k" onclick="selectResolutionPreset('4k')"><span>4K</span><small id="resolutionPreset4k">2048x2048</small></button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div id="imageCountControl" class="image-count-control" role="group" aria-label="生成数量">
                                            <span class="image-count-label">数量</span>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function defaultTitle(){ return tr('chat.newConversation'); }
        function setChatTitle(title){
            document.getElementById('chatTitle').textContent = title || defaultTitle();
        }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
            if(event.origin === location.origin && event.data?.type === 'lingdraw:apply-inspiration') {
                applyInspirationRemix(event.data.payload || {});
            }
        });
        window.addEventListener('studio-lang-change', () => {
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        });
        window.addEventListener('resize', () => {
            if(document.getElementById('modelPicker')?.classList.contains('open')) positionModelPicker();
            if(document.getElementById('resolutionPicker')?.classList.contains('open')) positionResolutionPicker();
        });
        function uuid(){
            if(crypto?.randomUUID) return crypto.randomUUID();
            return 'u-' + Math.random().toString(16).slice(2) + Date.now();
        }

        const USER_KEY = 'gpt_chat_browser_user';
        const CHAT_SETTINGS_KEY = 'gpt_chat_settings_v1';
        const CHAT_LAST_CONVERSATION_KEY = 'gpt_chat_last_conversation_v1';
        const CHAT_PENDING_REQUESTS_KEY = 'gpt_chat_pending_requests_v1';
        const CHAT_ATTACHMENT_MAX = 20;
        const CHAT_SIZE_MODE_VERSION = 3;
        const userId = localStorage.getItem(USER_KEY) || uuid();
        localStorage.setItem(USER_KEY, userId);

        function readChatSettings(){
            try {
                const raw = localStorage.getItem(CHAT_SETTINGS_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch(e) {
                return {};
            }
        }

        function isObject(value){
            return value && typeof value === 'object' && !Array.isArray(value);
        }

        const savedChatSettings = readChatSettings();
        let conversations = [];
        let currentConversation = null;
        let mode = ['agent','chat','image'].includes(savedChatSettings.mode) ? savedChatSettings.mode : 'agent';
        let provider = savedChatSettings.provider || 'comfly';
        let msModel = savedChatSettings.msModel || '';
        let activeChatModel = savedChatSettings.activeChatModel || '';
        let activeImageProvider = savedChatSettings.activeImageProvider || 'comfly';
        let activeImageModel = savedChatSettings.activeImageModel || '';
        let systemPrompt = String(savedChatSettings.systemPrompt || '').trim();
        let apiProviders = [];
        let chatProviderModels = isObject(savedChatSettings.chatProviderModels) ? savedChatSettings.chatProviderModels : {};
        let chatRatio = ['square','portrait','portrait43','landscape43','landscape','story','wide'].includes(savedChatSettings.chatRatio) ? savedChatSettings.chatRatio : 'square';
        let chatResolution = savedChatSettings.chatSizeModeVersion === CHAT_SIZE_MODE_VERSION && ['auto','1k','2k','4k'].includes(savedChatSettings.chatResolution) ? savedChatSettings.chatResolution : 'auto';
        let chatPresetResolution = ['1k','2k','4k'].includes(savedChatSettings.chatPresetResolution) ? savedChatSettings.chatPresetResolution : '1k';
        let imageCount = [1,2,3,4].includes(Number(savedChatSettings.imageCount)) ? Number(savedChatSettings.imageCount) : 1;
        let modelPickerScope = savedChatSettings.modelPickerScope === 'image' ? 'image' : 'chat';
        let modelPickerHome = null;
        let resolutionPickerHome = null;
        let refs = [];
        let drawingSize = null;
        let drawingSizeActive = false;
        let conversationCreationPromise = null;
        let conversationViewRevision = 0;
        const activeSendKeys = new Set();
        const activeRequests = new Map();
        const activeRegenerateKeys = new Set();
        let inspirationShareDraft = null;
        let inspirationShareBusy = false;

        function pendingRequestRecords(){
            try {
                const parsed = JSON.parse(localStorage.getItem(CHAT_PENDING_REQUESTS_KEY) || '[]');
                return Array.isArray(parsed) ? parsed.filter(item => item?.requestId && item?.conversationId) : [];
            } catch(e) {
                return [];
            }
        }

        function persistPendingRequest(record){
            const records = pendingRequestRecords();
            const previous = records.find(item => item.requestId === record.requestId);
            const next = records.filter(item => item.requestId !== record.requestId);
            next.push({...previous, ...record});
            localStorage.setItem(CHAT_PENDING_REQUESTS_KEY, JSON.stringify(next));
        }

        function removePendingRequest(requestId){
            const records = pendingRequestRecords().filter(item => item.requestId !== requestId);
            if(records.length) localStorage.setItem(CHAT_PENDING_REQUESTS_KEY, JSON.stringify(records));
            else localStorage.removeItem(CHAT_PENDING_REQUESTS_KEY);
        }

        const ACTIVE_GENERATION_STATUSES = new Set(['created', 'submitting', 'running', 'outcome_unknown']);

        function pendingModeFromMessage(message){
            const context = message?.request_context && typeof message.request_context === 'object'
                ? message.request_context
                : {};
            const requestMode = String(context.request_mode || '').toLowerCase();
            if(['image','agent'].includes(requestMode)) return requestMode;
            const action = String(context.action || '').toLowerCase();
            if(action === 'generate_image' || action === 'edit_image') return 'image';
            return String(message?.mode || 'agent').toLowerCase() === 'image' ? 'image' : 'agent';
        }

        function pendingTextForMode(requestMode){
            return requestMode === 'image' ? tr('chat.generatingImage') : tr('chat.agentWorking');
        }

        function restorePendingRequestsFromConversation(conversation){
            const conversationId = String(conversation?.id || '');
            const messages = Array.isArray(conversation?.messages) ? conversation.messages : [];
            if(!conversationId || !messages.length) return;
            const terminalRequestIds = new Set(messages
                .filter(message => message?.role === 'assistant' && message?.request_id && message.status !== 'outcome_unknown')
                .map(message => String(message.request_id)));
            terminalRequestIds.forEach(removePendingRequest);
            messages.forEach(message => {
                const requestId = String(message?.request_id || '');
                const requestContext = message?.request_context && typeof message.request_context === 'object'
                    ? message.request_context
                    : {};
                const generationStatus = String(requestContext.generation_status || '').toLowerCase();
                if(message?.role !== 'user' || message?.mode !== 'agent' || !requestId) return;
                if(!ACTIVE_GENERATION_STATUSES.has(generationStatus) || terminalRequestIds.has(requestId)) return;
                const requestMode = pendingModeFromMessage(message);
                persistPendingRequest({
                    requestId,
                    conversationId,
                    mode:requestMode,
                    message:String(message.content || ''),
                    attachments:Array.isArray(message.attachments) ? message.attachments : [],
                    pendingText:pendingTextForMode(requestMode),
                    createdAt:Number(message.created_at || Date.now()),
                    restoredFromServer:true,
                });
            });
        }

        function positionModelPicker(){
            const btn = document.getElementById('modelPickerBtn');

            if(!btn || !pop) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const width = Math.min(380, Math.max(300, viewportW - 32));
            const estimatedHeight = Math.min(390, Math.max(260, viewportH * .62));
            const availableAbove = Math.max(180, rect.top - 14);
            const maxHeight = Math.min(390, availableAbove, viewportH - 32);
            const left = Math.min(Math.max(16, rect.left), Math.max(16, viewportW - width - 16));
            const top = Math.max(12, rect.top - maxHeight - 10);
            pop.style.setProperty('--model-picker-left', `${Math.round(left)}px`);
            pop.style.setProperty('--model-picker-top', `${Math.round(Math.max(16, top))}px`);
            pop.style.setProperty('--model-picker-width', `${Math.round(width)}px`);
            pop.style.setProperty('--model-picker-max-height', `${Math.round(maxHeight)}px`);
            requestAnimationFrame(() => {
                const box = pop.getBoundingClientRect();
                const nextLeft = box.right > viewportW - 12 ? (left - (box.right - viewportW + 12)) : left;
                const overlap = box.bottom - (rect.top - 8);
                const nextTop = overlap > 0 ? (top - overlap - 2) : top;
                pop.style.setProperty('--model-picker-left', `${Math.round(Math.max(12, nextLeft))}px`);
                pop.style.setProperty('--model-picker-top', `${Math.round(Math.max(12, nextTop))}px`);
            });

        function positionResolutionPicker(){

            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const autoLayout = chatResolution === 'auto' && !(drawingSize && drawingSizeActive);
            const desiredWidth = autoLayout ? 300 : 420;
            const width = Math.min(desiredWidth, Math.max(260, viewportW - 32));
            const safeX = 12;
            const safeTop = 12;
            const safeBottom = 18;
            const gap = 10;
            const left = Math.min(Math.max(safeX, rect.left + rect.width / 2 - width / 2), Math.max(safeX, viewportW - width - safeX));
            const availableAbove = Math.max(96, rect.top - safeTop - gap);
            const initialHeight = Math.min(autoLayout ? 220 : 390, availableAbove, viewportH - safeTop - safeBottom);
            const initialTop = Math.max(safeTop, rect.top - initialHeight - gap);
            pop.style.setProperty('--resolution-picker-left', `${Math.round(left)}px`);
            pop.style.setProperty('--resolution-picker-top', `${Math.round(initialTop)}px`);
            pop.style.setProperty('--resolution-picker-width', `${Math.round(width)}px`);
            pop.style.setProperty('--resolution-picker-max-height', `${Math.round(initialHeight)}px`);
            pop.style.setProperty('--resolution-picker-list-height', '320px');
            requestAnimationFrame(() => {
                const naturalHeight = Math.ceil(pop.scrollHeight || pop.getBoundingClientRect().height || 160);
                const maxHeight = Math.max(96, Math.min(naturalHeight, availableAbove, viewportH - safeTop - safeBottom));
                const headHeight = Math.ceil(pop.querySelector('.resolution-picker-head')?.getBoundingClientRect().height || 50);
                const drawingHeight = drawingSize ? Math.ceil(document.getElementById('drawingSizeOption')?.getBoundingClientRect().height || 40) : 0;
                const listHeight = Math.max(58, maxHeight - headHeight - drawingHeight - 20);
                const top = Math.max(safeTop, rect.top - maxHeight - gap);
                pop.style.setProperty('--resolution-picker-max-height', `${Math.round(maxHeight)}px`);
                pop.style.setProperty('--resolution-picker-list-height', `${Math.round(listHeight)}px`);
                pop.style.setProperty('--resolution-picker-top', `${Math.round(top)}px`);
                const box = pop.getBoundingClientRect();
                const nextLeft = box.right > viewportW - 12 ? (left - (box.right - viewportW + 12)) : left;
                const overlap = box.bottom - (rect.top - 8);
                const nextTop = overlap > 0 ? (top - overlap - 2) : top;
                pop.style.setProperty('--resolution-picker-left', `${Math.round(Math.max(12, nextLeft))}px`);
                pop.style.setProperty('--resolution-picker-top', `${Math.round(Math.max(12, nextTop))}px`);
            });
        }

        async function loadConversations(options={}){
            const expectedRevision = Number.isInteger(options.expectedRevision) ? options.expectedRevision : conversationViewRevision;
            const openInitial = options.openInitial !== false;
            const data = await fetch('/api/conversations?surface=gpt_chat', {headers:{'X-User-ID':userId}}).then(r=>r.json());
            conversations = data.conversations || [];
            renderThreads();
            if(openInitial && expectedRevision === conversationViewRevision && !currentConversation && !conversationCreationPromise) {
                const rememberedId = rememberedConversation();
                const target = (rememberedId && conversations.find(item => item.id === rememberedId)) || conversations[0];
                if(target) await openConversation(target.id, false, expectedRevision);
            }
            if(expectedRevision === conversationViewRevision && !currentConversation && !conversationCreationPromise) renderMessages([]);
        }

        function beginConversationCreation(revision){
            const request = fetch('/api/conversations', {
                method:'POST',
                headers:headers(),
                body:JSON.stringify({title:'新对话', surface:'gpt_chat', context_id:''}),
            }).then(ChatRequestRecovery.readResponse).then(data => {
                const conversation = data.conversation;
                if(revision === conversationViewRevision){
                    currentConversation = conversation;
                    rememberConversation(conversation.id);
                    setChatTitle(conversation.title);
                    renderThreads();
                }
                return conversation;
            });
            const tracked = request.finally(() => {
                if(conversationCreationPromise === tracked) conversationCreationPromise = null;
            });
            conversationCreationPromise = tracked;
            return tracked;
        }

        async function ensureConversationForSend(){
            if(currentConversation?.id) return currentConversation;
            if(!conversationCreationPromise){
                const revision = ++conversationViewRevision;
                currentConversation = null;
                rememberConversation('');
                setChatTitle(defaultTitle());
                renderThreads();
                renderMessages([]);
                beginConversationCreation(revision);
            }
            return conversationCreationPromise;
        }

        async function refreshConversationAfterRequests(conversationId){
            if(!conversationId || currentConversation?.id !== conversationId) return;
            const data = await fetch(`/api/conversations/${conversationId}?surface=gpt_chat`, {headers:{'X-User-ID':userId}}).then(ChatRequestRecovery.readResponse);
            if(currentConversation?.id !== conversationId) return;
            currentConversation = data.conversation;
            rememberConversation(currentConversation.id);
            setChatTitle(currentConversation.title);
            restorePendingRequestsFromConversation(currentConversation);
            renderConversationState(currentConversation);
            await loadConversations({openInitial:false});
        }

        async function resumePendingRequest(record){
            const requestId = String(record.requestId || '');
            const conversationId = String(record.conversationId || '');
            if(!requestId || !conversationId || activeRequests.has(requestId)) return;
            activeRequests.set(requestId, {
                ...record,
                conversationId,
                sendKey:record.sendKey || '',
                recovered:true,
                mode:record.mode || 'agent',
                message:String(record.message || ''),
                attachments:Array.isArray(record.attachments) ? record.attachments : [],
                pendingText:record.pendingText || pendingTextForMode(record.mode || 'agent'),
            });
            syncSendBusyState();
            const update = (state, notice) => {
                // A storage failure must never turn recovery into a new POST.
                try { persistPendingRequest({...record, recoveryState:state, recoveryNotice:notice}); }
                catch(_) { activeRequests.get(requestId).pendingText = notice; }
                renderRecoveryNotices();
            };
            update('querying', '连接中断，正在查询生成结果');
            try {
                const data = await ChatRequestRecovery.poll(requestId, {
                    headers:{'X-User-ID':userId},
                    onProgress:notice => update('querying', notice),
                });
                if(data.status === 'succeeded' || data.status === 'failed'){
                    // The status endpoint contains only a conversation ID. Merge
                    // its durable message before attempting a full refresh.
                    if(currentConversation?.id === conversationId && data.message){
                        const messages = currentConversation.messages || [];
                        currentConversation.messages = messages.filter(item => !(item.role === 'assistant' && item.request_id === requestId));
                        if(!messages.some(item => item.role === 'user' && item.request_id === requestId)){
                            const options = record.requestOptions || {};
                            currentConversation.messages.push({role:'user', request_id:requestId, content:record.message,
                                attachments:record.attachments || [], request_context:{size:record.requestedSize,
                                    size_is_explicit:options.sizeIsExplicit, image_provider:options.imageProvider,
                                    image_model:options.imageModel, requested_count:options.imageCount}});
                        }
                        currentConversation.messages.push(data.message);
                    }
                    removePendingRequest(requestId);
                    clearRequestError(requestId);
                    if(data.status === 'failed' && !data.message){
                        showRequestError(requestId, data.detail?.message || '生成失败，请检查资料后重试');
                    }
                } else {
                    update('paused', data.reason);
                }
            } catch(err) {
                update('paused', '查询暂时中断，任务记录已保留，请继续查询');
            } finally {
                activeRequests.delete(requestId);
                syncSendBusyState();
                if(currentConversation?.id === conversationId) renderConversationState(currentConversation);
                renderRecoveryNotices();
                try { await refreshConversationAfterRequests(conversationId); }
                catch(e) { await loadConversations({openInitial:false}).catch(() => {}); }
            }
        }

        function resumePendingRequests(){
            pendingRequestRecords().filter(record => record.conversationId === currentConversation?.id && record.recoveryState !== 'paused')
                .forEach(record => { void resumePendingRequest(record); });
        }

        function clearRequestError(requestId){
            const notice = document.getElementById('composerError');
            if(notice.dataset.requestId !== requestId) return;
            notice.textContent = '';
            notice.classList.add('hidden');
            delete notice.dataset.requestId;
        }

        function showRequestError(requestId, message){
            const notice = document.getElementById('composerError');
            notice.dataset.requestId = requestId;

            notice.classList.remove('hidden');
        }

        function renderRecoveryNotices(){
            const container = document.getElementById('requestRecoveryNotices');
            if(!container) return;
            const records = pendingRequestRecords().filter(record => record.conversationId === currentConversation?.id);
            const visible = new Set(records.map(record => record.requestId));
            for(const row of [...container.children]) if(!visible.has(row.dataset.requestId)) row.remove();
            records.forEach(record => {
                let row = [...container.children].find(item => item.dataset.requestId === record.requestId);
                if(!row){
                    row = document.createElement('div');
                    row.dataset.requestId = record.requestId;
                    row.style.padding = '6px 4px';
                    const label = document.createElement('span');
                    label.className = 'request-recovery-label';
                    row.appendChild(label);
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.textContent = '继续查询';
                    button.style.cssText = 'margin-left:10px;text-decoration:underline';
                    button.onclick = () => {
                        const latest = pendingRequestRecords().find(item => item.requestId === record.requestId);
                        if(latest) void resumePendingRequest(latest);
                    };
                    row.appendChild(button);
                    container.appendChild(row);
                }
                const seconds = Math.max(0, Math.floor((Date.now() - Number(record.createdAt || Date.now())) / 1000));
                row.firstElementChild.textContent = `${record.recoveryNotice || '正在生成，请勿重复提交'} · 已等待 ${Math.floor(seconds / 60)}分${seconds % 60}秒`;
                row.lastElementChild.hidden = activeRequests.has(record.requestId);
            });

            renderThreads();
            renderMessages([]);
            toggleHistory(false);
            const conversation = await beginConversationCreation(revision);

            await loadConversations({openInitial:false, expectedRevision:revision});
            if(currentConversation?.id === conversation.id) renderConversationState(currentConversation);
        }

        async function openConversation(id, closePanel=false, expectedRevision=null){
            const revision = Number.isInteger(expectedRevision) ? expectedRevision : ++conversationViewRevision;
            if(!Number.isInteger(expectedRevision)){
                currentConversation = null;
                setChatTitle(defaultTitle());
                renderThreads();
                renderMessages([]);
            }
            const data = await fetch(`/api/conversations/${id}?surface=gpt_chat`, {headers:{'X-User-ID':userId}}).then(r=>r.json());
            if(revision !== conversationViewRevision) return null;
            currentConversation = data.conversation;
            rememberConversation(currentConversation.id);
            setChatTitle(currentConversation.title);
            restorePendingRequestsFromConversation(currentConversation);
            resumePendingRequests();
            renderThreads();
            renderConversationState(currentConversation);
            if(closePanel) toggleHistory(false);
            return currentConversation;
        }

        async function deleteConversation(id, event){
            event.stopPropagation();
            if(!confirm(tr('chat.deleteConfirm'))) return;
            await fetch(`/api/conversations/${id}?surface=gpt_chat`, {method:'DELETE', headers:{'X-User-ID':userId}});
            const deletedCurrent = currentConversation?.id === id;
            if(deletedCurrent){ conversationViewRevision++; currentConversation = null; rememberConversation(''); setChatTitle(''); renderMessages([]); }

        function chatSizeFromPrompt(message, fallbackSize = currentChatSize()){
            if(hasExplicitChatSize()) return currentChatSize();
            const text = String(message || '');
            const direct = text.match(/(^|[^\d])([1-9]\d{2,4})\s*[xX×*]\s*([1-9]\d{2,4})(?!\d)/);
            if(direct) {
                const w = Number(direct[2]);
                const h = Number(direct[3]);
                if(w >= 256 && h >= 256) return `${w}x${h}`;
            }
            const normalized = text.replace(/[：﹕∶]/g, ':').replace(/比/g, ':').replace(/[／/]/g, ':');
            const match = normalized.match(/(^|[^\d])(1|2|3|4|9|16)\s*:\s*(1|2|3|4|9|16)(?!\d)/);
            if(!match) return fallbackSize;
            const ratio = `${Number(match[2])}:${Number(match[3])}`;
            const ratioMap = { '1:1':'square', '2:3':'portrait', '3:2':'landscape', '3:4':'portrait43', '4:3':'landscape43', '9:16':'story', '16:9':'wide' };
            const key = ratioMap[ratio];
            if(!key) return fallbackSize;
            const wants4k = /4\s*k|4K|超清|超高分辨率/i.test(text);
            const wants2k = /2\s*k|2K|高清|高分辨率/i.test(text);
            const fallbackEdge = Math.max(...String(fallbackSize || '').split(/[xX×*]/).map(n => Number(n) || 0));
            const targetLabel = wants4k ? '4k' : (wants2k ? '2k' : (chatResolution === 'auto' ? '1k' : (fallbackEdge >= 2400 ? '4k' : (fallbackEdge >= 1500 ? '2k' : '1k'))));
            return (SIZE_OPTIONS[key] || SIZE_OPTIONS.square).find(([, label]) => label === targetLabel)?.[0] || fallbackSize;
        }

        function renderActiveConversationRequests(conversation){
            const conversationId = String(conversation?.id || '');
            const messages = Array.isArray(conversation?.messages) ? conversation.messages : [];
            if(!conversationId) return;
            const terminalRequestIds = new Set(messages
                .filter(message => message?.role === 'assistant' && message?.request_id)
                .map(message => String(message.request_id)));
            const requestsById = new Map();
            messages.forEach(message => {
                const requestId = String(message?.request_id || '');
                const generationStatus = String(message?.request_context?.generation_status || '').toLowerCase();
                if(message?.role !== 'user' || !requestId || terminalRequestIds.has(requestId)) return;
                if(!ACTIVE_GENERATION_STATUSES.has(generationStatus)) return;
                const requestMode = pendingModeFromMessage(message);
                requestsById.set(requestId, {
                    conversationId,
                    message:String(message.content || ''),
                    attachments:Array.isArray(message.attachments) ? message.attachments : [],
                    mode:requestMode,
                    pendingText:pendingTextForMode(requestMode),
                    durable:true,
                });
            });
            pendingRequestRecords().forEach(record => {
                const requestId = String(record?.requestId || '');
                if(String(record?.conversationId || '') !== conversationId || !requestId || terminalRequestIds.has(requestId)) return;
                requestsById.set(requestId, {...requestsById.get(requestId), ...record, conversationId});
            });
            activeConversationRequests(conversationId).forEach(([requestId, request]) => {
                if(!terminalRequestIds.has(requestId)) requestsById.set(requestId, {...requestsById.get(requestId), ...request});
            });
            const requests = [...requestsById.entries()];
            if(!requests.length) return;
            document.querySelector('#messages .empty-state')?.remove();
            requests.forEach(([requestId, request]) => {
                const matching = messages.filter(message => String(message?.request_id || '') === requestId);
                if(!matching.some(message => message.role === 'user') && request.message){
                    addMessageBubble({
                        role:'user',
                        content:request.message,
                        attachments:request.attachments || [],
                        request_id:requestId,
                    });
                }
                if(matching.some(message => message.role === 'assistant')) return;
                const pending = addMessageBubble({
                    role:'assistant',
                    content:request.pendingText || pendingTextForMode(request.mode || 'agent'),
                    request_id:requestId,
                });
                pending.bubble.classList.add('streaming');
            });
            scrollBottom();
        }

        function renderConversationState(conversation){
