    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.07.15.1784259302');

        :root {
            --accent: #111827;
            --bg: #f9fafb;
            --card: #ffffff;
            --easing: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- 极简悬浮浅灰滚动条 (无底色/左移) --- */
        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: #d8d8d8 !important;
            border: 3px solid transparent !important;
            border-right-width: 5px !important;
            /* 增加右侧间距，使滚动条向左位移 */
            background-clip: padding-box !important;
            border-radius: 10px !important;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: #c0c0c0 !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: #d8d8d8 transparent !important;
        }

        body {
            background-color: var(--bg);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--accent);
            -webkit-font-smoothing: antialiased;
        }

        .container-box {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 40px;
            margin-top: 50px;
        }

        /* 统一组件风格 */
        .glass-btn {
            background: #111827;
            transition: all 0.3s var(--easing);
        }

        .glass-btn:hover {
            background: #000;
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        }

        .glass-btn:active {
            transform: scale(0.98);
        }

        .upload-item {
            background: var(--card);
            border: 1px dashed #e2e8f0;
            transition: all 0.4s var(--easing);
        }

        .upload-item:hover {
            border-color: #000;
            background: #fff;
            transform: translateY(-2px);
        }

        .result-frame {
            background: #ffffff;
            border-radius: 32px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.02);
        }

        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
        }

        @media (min-width: 768px) {
            .masonry-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .masonry-item {
            aspect-ratio: 1 / 1;
            background: #fff;
            border: 1px solid #f1f5f9;
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.5s var(--easing);
            position: relative;
        }

        .masonry-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .nano-input {
            background: #ffffff;
            border-radius: 16px;
            transition: all 0.3s ease;
            border: 1px solid #e5e7eb;
        }

        .nano-input:focus {
            background: #ffffff;
            box-shadow: 0 0 0 2px #000;
            border-color: transparent;
        }

        @keyframes b-loading {
            0% {
                transform: scale(1);
                background: #000;
            }

            50% {
                transform: scale(1.15);
                background: #444;
            }

            100% {
                transform: scale(1);
                background: #000;
            }
        }

        .loading-box {
            width: 10px;
            height: 10px;
            animation: b-loading 1s infinite var(--easing);
        }

        .tool-panel {
            background: #fff;
            border: 1px solid #edf0f3;
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .04em;
        }

        .size-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 8px;
        }

        .size-field {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .size-select {
            width: 100%;
            min-width: 0;
            height: 38px;
            border: 1px solid #edf2f7;
            border-radius: 14px;
            background: #f8fafc;
            color: #111827;
            outline: none;
            padding: 0 12px;
            font-size: 11px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .size-select:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .mode-badge {
            margin-left: auto;
            color: #0f172a;
            background: #eef2ff;
            border: 1px solid #e0e7ff;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        @media (max-width: 640px) {
            .size-row { grid-template-columns: 1fr; }
        }

        /* 角度控制滑块：明/暗模式都保持清晰的轨道与滑块 */
        #rotate-h, #rotate-v, #distance {
            -webkit-appearance: none;
            appearance: none;

            border-radius: 9999px;

        #rotate-h::-webkit-slider-thumb,

        #distance::-webkit-slider-thumb {

            height: 14px;
            border-radius: 50%;
            background: #111827;
            border: 2px solid #fff;
            cursor: pointer;

            background: #2a3444 !important;

        html.studio-theme-dark #rotate-h::-webkit-slider-thumb,

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('threeContainer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Objects
        const geometry = new THREE.PlaneGeometry(3, 3);
        const material = new THREE.MeshStandardMaterial({
            color: 0x444444,
            side: THREE.DoubleSide
        });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x333333);
        scene.add(gridHelper);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.DirectionalLight(0xffffff, 1);
        pointLight.position.set(5, 10, 7);
        scene.add(pointLight);

        // Camera Logic
        const sliderH = document.getElementById('rotate-h');
        const sliderV = document.getElementById('rotate-v');
        const sliderD = document.getElementById('distance');
        const valH = document.getElementById('val-horizontal');
        const valV = document.getElementById('val-vertical');
        const valD = document.getElementById('val-distance');

        window.updateCamera = function () {
            const lon = parseFloat(sliderH.value);
            const lat = parseFloat(sliderV.value);
            const dist = parseFloat(sliderD.value);

            // Sync inputs (avoid overwriting if active)
            if (document.activeElement !== valH) valH.value = lon;
            if (document.activeElement !== valV) valV.value = lat;
            if (document.activeElement !== valD) valD.value = dist.toFixed(1);

            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);

            camera.position.x = dist * Math.sin(phi) * Math.sin(theta);
            camera.position.y = dist * Math.cos(phi);
            camera.position.z = dist * Math.sin(phi) * Math.cos(theta);
            camera.lookAt(0, 0, 0);

            // Real-time update prompt
            updatePromptWithAngle(lon, lat, dist);
        }

        window.syncInput = (type) => {
            if (type === 'h') {
                let v = parseFloat(valH.value);
                if (!isNaN(v)) sliderH.value = v;
            } else if (type === 'v') {
                let v = parseFloat(valV.value);
                if (!isNaN(v)) sliderV.value = v;
            } else if (type === 'd') {
                let v = parseFloat(valD.value);
                if (!isNaN(v)) sliderD.value = v;
            }
            window.updateCamera();
        };

        window.resetControl = (type) => {
            if (type === 'h') {
                sliderH.value = 0;
                valH.value = 0;
            } else if (type === 'v') {
                sliderV.value = 0;
                valV.value = 0;
            } else if (type === 'd') {
                sliderD.value = 4;
                valD.value = 4;
            }
            window.updateCamera();
        };

        function updatePromptWithAngle(h, v, d) {
            let parts = [];
            if (h !== 0) {
                const dir = h > 0 ? "向右" : "向左";
                parts.push(`${dir}旋转${Math.abs(h)}度`);
            }
            if (v !== 0) {
                const dir = v > 0 ? "俯视" : "仰视";
                parts.push(`${dir}${Math.abs(v)}度`);
            }

            // Distance logic
            let lensText = "";
            if (d > 4) {
                lensText = "使用广角镜头";
            } else if (d < 4) {
                lensText = "使用特写镜头";
            }

            // Removed "保持原位" default text to show placeholder

            let resultText = "";
            if (parts.length > 0) {
                resultText = `将相机${parts.join("，")}`;
            }

            if (lensText) {
                resultText += (resultText ? "，" : "将相机") + lensText;
            }

            const promptInput = document.getElementById('promptInput');
            let currentText = promptInput.value;

            // Regex to find existing angle command (including lens info)
            const regex = /将相机.*?(?=(\n|$))/g;

            if (regex.test(currentText)) {
                // Replace existing
                promptInput.value = currentText.replace(regex, resultText);
            } else {
                // Append if not exists and resultText is not empty
                if (resultText) {
                    if (currentText.trim()) {
                        promptInput.value = currentText.trim() + '\n' + resultText;
                    } else {
                        promptInput.value = resultText;
                    }
                }
            }
        }

        sliderH.addEventListener('input', window.updateCamera);
        sliderV.addEventListener('input', window.updateCamera);
        sliderD.addEventListener('input', window.updateCamera);
        window.updateCamera();

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Handle Resize
        const resizeObserver = new ResizeObserver(() => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
        resizeObserver.observe(container);

        // Expose function to update texture
        window.update3DTexture = (url) => {
            new THREE.TextureLoader().load(url, (texture) => {
                texture.colorSpace = THREE.SRGBColorSpace;

                // Adjust plane aspect ratio to match image
                const imageAspect = texture.image.width / texture.image.height;
                cube.scale.set(1, 1 / imageAspect, 1);
                if (imageAspect > 1) {
                    cube.scale.set(1, 1 / imageAspect, 1);
                    // Reset base scale to 3
                    cube.geometry.dispose();
                    cube.geometry = new THREE.PlaneGeometry(3, 3 / imageAspect);
                    cube.scale.set(1, 1, 1);
                } else {
                    cube.geometry.dispose();
                    cube.geometry = new THREE.PlaneGeometry(3 * imageAspect, 3);
                    cube.scale.set(1, 1, 1);
                }

                cube.material = new THREE.MeshBasicMaterial({
                    map: texture,
                    side: THREE.DoubleSide
                });
                cube.material.needsUpdate = true;

                // Show control panel (already visible, but keep logic safe)
                document.getElementById('cameraControl').classList.remove('hidden');

                // Force resize check after texture load
                setTimeout(() => {
                    const w = container.clientWidth;
                    const h = container.clientHeight;
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                }, 100);
            });
        };
    </script>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('nav.angle');
            const btnText = document.getElementById('btnText');
            if(btnText && !document.getElementById('genBtn')?.disabled) btnText.textContent = tr('studio.generateAngle');
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
        });
        window.addEventListener('studio-lang-change', () => { document.title = tr('nav.angle'); });
        
        const ANGLE_PROVIDER_KEY = 'angle_api_provider';
        const ANGLE_MODEL_KEY = 'angle_api_model';
        const ANGLE_COUNT_KEY = 'angle_output_count';
        const ANGLE_HIDDEN_PROVIDER_IDS = new Set(['modelscope', 'runninghub', 'volcengine']);
        const ANGLE_KEYLESS_PROTOCOLS = new Set(['jimeng', 'codex', 'gemini-cli']);

        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CLIENT_ID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CLIENT_ID);

        let uploadedReference = null;
        let apiProviders = [];
        let provider = '';
        let selectedModel = '';
        let outputCount = 1;
        let currentResult = null;
        let activeGenerationRequestId = sessionStorage.getItem('angle_generation_request_id') || '';
        let latestGenerationRequestId = activeGenerationRequestId;
        let angleGenerationInFlight = 0;
        function angleGenerationRequestId() {
            if (!activeGenerationRequestId) {
                activeGenerationRequestId = generateUUID();
                sessionStorage.setItem('angle_generation_request_id', activeGenerationRequestId);
            }
            return activeGenerationRequestId;
        }
        let allHistory = [];
        let currentIndex = 0;
        const PAGE_SIZE = 30;

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const promptInput = document.getElementById('promptInput');

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
        }

        function apiErrorMessage(response, data) {
            const detail = data?.detail ?? data?.error ?? data?.message;
            if (typeof detail === 'string' && detail.trim()) return detail.trim();
            if (detail && typeof detail === 'object') {
                if (typeof detail.message === 'string' && detail.message.trim()) return detail.message.trim();
                if (detail.code === 'request_id_conflict') return '请求编号已被不同参数使用，请点击“再次生成”创建新任务';
            }
            if (response.status === 502) return '生成服务暂时不可用（502），任务编号已保留，请稍后重试';
            if (response.status === 503) return '生成服务正在维护（503），任务编号已保留，请稍后重试';
            if (response.status === 504) return '服务器等待生成结果超时（504），请勿重复提交，稍后将按原任务恢复';
            return `请求失败（HTTP ${response.status}）`;
        }

        async function apiJson(input, init) {
            let response;
            try {
                response = await fetch(input, init);
            } catch (error) {
                error.retryable = true;
                throw error;
            }
            const text = await response.text();
            let data = null;
            if (text.trim()) {
                try {
                    data = JSON.parse(text);
                } catch (error) {
                    if (response.ok) {
                        const invalid = new Error('服务器返回了无法识别的响应，请稍后重试');
                        invalid.status = response.status;
                        throw invalid;
                    }
                }
            }
            if (!response.ok) {
                const error = new Error(apiErrorMessage(response, data));
                error.status = response.status;
                error.retryable = response.status === 502 || response.status === 503 || response.status === 504;
                error.data = data;
                throw error;
            }
            if (!data || typeof data !== 'object') {
                throw new Error('服务器未返回有效 JSON 数据');
            }
            return data;
        }

        function uniqueModels(list) {
            const seen = new Set();
            return (list || []).map(item => String(item || '').trim()).filter(item => item && !seen.has(item) && seen.add(item));
        }

        function imageProviders() {
            return (apiProviders || []).filter(item => {
                if (!item || item.enabled === false) return false;
                const id = String(item.id || '').trim().toLowerCase();
                const protocol = String(item.protocol || '').trim().toLowerCase();
                const hasCredential = item.has_key === true
                    || item.has_wallet_key === true
                    || ANGLE_KEYLESS_PROTOCOLS.has(protocol);
                return !ANGLE_HIDDEN_PROVIDER_IDS.has(id)
                    && hasCredential
                    && uniqueModels(item.image_models).length;
            });
        }

        function providerById(id) {
            const providers = imageProviders();
            return providers.find(item => item.id === id) || providers[0] || null;
        }

        function providerModels(id) {
            return uniqueModels(providerById(id)?.image_models || []);
        }

        function renderProviderControls() {
            const providerSelect = document.getElementById('providerSelect');
            const modelSelect = document.getElementById('modelSelect');
            const countSelect = document.getElementById('countSelect');
            const badge = document.getElementById('providerModeBadge');
            const providers = imageProviders();

            if (!providers.length) {
                provider = '';
                selectedModel = '';
                providerSelect.innerHTML = '<option value="">请先在 API 设置中添加生图平台</option>';
                modelSelect.innerHTML = '<option value="">暂无可用模型</option>';
                providerSelect.disabled = true;
                modelSelect.disabled = true;
                badge.textContent = 'API';
                countSelect.value = String(outputCount);
                return;
            }

            providerSelect.disabled = false;
            modelSelect.disabled = false;
            if (!providers.some(item => item.id === provider)) provider = providers[0].id;
            const currentProvider = providerById(provider);
            const models = providerModels(provider);
            if (!models.includes(selectedModel)) selectedModel = models[0] || '';

            providerSelect.innerHTML = providers.map(item =>
                `<option value="${escapeHtml(item.id)}" ${item.id === provider ? 'selected' : ''}>${escapeHtml(item.name || item.id)}</option>`
            ).join('');
            modelSelect.innerHTML = models.map(model =>
                `<option value="${escapeHtml(model)}" ${model === selectedModel ? 'selected' : ''}>${escapeHtml(model)}</option>`
            ).join('');
            badge.textContent = String(currentProvider?.name || currentProvider?.id || 'API').toUpperCase();
            countSelect.value = String(outputCount);

            localStorage.setItem(ANGLE_PROVIDER_KEY, provider);
            localStorage.setItem(ANGLE_MODEL_KEY, selectedModel);
        }

        async function refreshApiModels() {
            try {
                const config = await apiJson('/api/config');
                apiProviders = Array.isArray(config.api_providers) ? config.api_providers : [];
            } catch (error) {
                console.error(error);
                apiProviders = [];
            }
            renderProviderControls();
        }

        window.setProvider = function(next) {
            provider = String(next || '');
            selectedModel = providerModels(provider)[0] || '';
            renderProviderControls();
        };

        window.setModel = function(next) {
            selectedModel = String(next || '');
            localStorage.setItem(ANGLE_MODEL_KEY, selectedModel);
        };

        window.setCount = function(next) {
            outputCount = Math.max(1, Math.min(4, parseInt(next, 10) || 1));
            localStorage.setItem(ANGLE_COUNT_KEY, String(outputCount));
        };

        provider = localStorage.getItem(ANGLE_PROVIDER_KEY) || '';
        selectedModel = localStorage.getItem(ANGLE_MODEL_KEY) || '';
        outputCount = Math.max(1, Math.min(4, parseInt(localStorage.getItem(ANGLE_COUNT_KEY), 10) || 1));

        let apiSyncTimer = null;
        function scheduleApiModelRefresh() {
            clearTimeout(apiSyncTimer);
            apiSyncTimer = setTimeout(refreshApiModels, 150);
        }
        window.addEventListener('message', event => {
            if (event.data?.type && ['providers-changed','workflows-changed'].includes(event.data.type)) scheduleApiModelRefresh();
        });
        try {
            const studioApiChannel = new BroadcastChannel('studio-api');
            studioApiChannel.addEventListener('message', scheduleApiModelRefresh);
        } catch (error) {}
        document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleApiModelRefresh(); });

        dropzone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        // Drag and Drop
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('border-black', 'bg-gray-50');
        });
        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('border-black', 'bg-gray-50');
        });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-black', 'bg-gray-50');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // Paste support
        let isHovering = false;
        dropzone.addEventListener('mouseenter', () => isHovering = true);
        dropzone.addEventListener('mouseleave', () => isHovering = false);
        window.addEventListener('paste', (e) => {
            if (!isHovering) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    handleFile(file);
                    break;
                }
            }
        });

        async function handleFile(file) {
            if (!file) return;
            uploadedReference = null;
            const btn = document.getElementById('genBtn');
            const btnText = document.getElementById('btnText');

            btn.disabled = true;
            btnText.innerText = tr('studio.uploading');

            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewImg.classList.remove('hidden');
                document.getElementById('uploadContent').classList.add('opacity-0');
                document.getElementById('changeOverlay').classList.replace('hidden', 'flex');

                // Automatically apply to 3D scene
                if (window.update3DTexture) {
                    window.update3DTexture(e.target.result);
                }
            };
            reader.readAsDataURL(file);

            const formData = new FormData();
            formData.append('files', file);
            try {
                const data = await apiJson('/api/ai/upload', { method: 'POST', body: formData });
                uploadedReference = data.files?.[0] || null;
                if (!uploadedReference?.url) throw new Error('上传结果无效');
                btn.disabled = false;
                btnText.innerText = tr('studio.generateAngle');
            } catch (err) {
                console.error("Upload error");
                btnText.innerText = tr('studio.uploadFailed');
                btn.disabled = false;
            }
        }

        function applyAngleToPrompt() {
            const h = parseInt(document.getElementById('rotate-h').value);
            const v = parseInt(document.getElementById('rotate-v').value);

            let parts = [];
            if (h !== 0) {
                const dir = h > 0 ? "向右" : "向左";
                parts.push(`${dir}旋转${Math.abs(h)}度`);
            }
            if (v !== 0) {
                const dir = v > 0 ? "俯视" : "仰视";
                parts.push(`${dir}${Math.abs(v)}度`);
            }

            if (parts.length === 0) {
                parts.push("保持原位");
            }

            const resultText = `将相机${parts.join("，")}`;

            const promptInput = document.getElementById('promptInput');
            // Check if there is existing content, if so append new line
            if (promptInput.value.trim()) {
                promptInput.value += '\n' + resultText;
            } else {
                promptInput.value = resultText;
            }

            // Visual feedback
            promptInput.style.transition = "0.2s";
            promptInput.style.borderColor = "#000";
            promptInput.style.boxShadow = "0 0 0 2px rgba(0,0,0,0.1)";
            setTimeout(() => {
                promptInput.style.borderColor = "";
                promptInput.style.boxShadow = "";
            }, 500);
        }

        function angleOutputSize() {
            const sourceWidth = previewImg.naturalWidth || 1024;
            const sourceHeight = previewImg.naturalHeight || 1024;
            const scale = Math.min(1, 1536 / Math.max(sourceWidth, sourceHeight));
            const width = Math.max(64, Math.round(sourceWidth * scale / 16) * 16);
            const height = Math.max(64, Math.round(sourceHeight * scale / 16) * 16);
            return `${width}x${height}`;
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function setAngleLoadingMessage(message) {
            const label = document.querySelector('#loadingState p');
            if (label) label.textContent = message || tr('studio.processing');
        }

        function beginAngleGeneration(requestId) {
            latestGenerationRequestId = requestId;
            angleGenerationInFlight += 1;
            const btn = document.getElementById('genBtn');
            document.getElementById('generateAgainBtn').classList.remove('hidden');
            btn.disabled = true;
            btn.style.backgroundColor = '#333';
            btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 text-yellow-400 fill-yellow-400 animate-pulse"></i><span class="tracking-[0.4em] text-[11px] uppercase">${tr('studio.processing')}</span>`;
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('outputImg').classList.add('hidden');
            document.getElementById('downloadBtn').classList.add('hidden');
            document.getElementById('textResult').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
            setAngleLoadingMessage(tr('studio.processing'));
            lucide.createIcons();
        }

        function endAngleGeneration() {
            angleGenerationInFlight = Math.max(0, angleGenerationInFlight - 1);
            const btn = document.getElementById('genBtn');
            btn.disabled = angleGenerationInFlight > 0;
            document.getElementById('generateAgainBtn').classList.toggle('hidden', angleGenerationInFlight === 0);
            if (angleGenerationInFlight === 0) {
                btn.style.backgroundColor = '';
                btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i><span id="btnText">${tr('studio.generateAngle')}</span>`;
                lucide.createIcons();
            }
        }

        function angleTaskResult(task) {
            const result = task?.result && typeof task.result === 'object' ? task.result : task;
            return {
                ...result,
                request_id: task?.request_id || result?.request_id || '',
                task_id: task?.id || task?.task_id || result?.task_id || ''
            };
        }

        async function waitForAngleTask(taskId, requestId) {
            let delay = 1000;
            while (true) {
                await wait(delay);
                let task;
                try {
                    task = await apiJson(`/api/canvas-image-tasks/${encodeURIComponent(taskId)}`);
                    delay = Math.min(5000, Math.max(1200, delay + 400));
                    if (latestGenerationRequestId === requestId) setAngleLoadingMessage(tr('studio.processing'));
                } catch (error) {
                    if (!error.retryable) throw error;
                    delay = Math.min(15000, Math.max(2500, delay * 2));
                    if (latestGenerationRequestId === requestId) {
                        setAngleLoadingMessage('服务器连接中断，正在按原任务恢复…');
                    }
                    continue;
                }
                const status = String(task.status || '').toLowerCase();
                if (status === 'succeeded') {
                    const result = angleTaskResult(task);
                    if (!result.images?.length) throw new Error('任务已完成，但没有返回生成图片');
                    return result;
                }
                if (status === 'failed' || status === 'cancelled' || status === 'canceled') {
                    const error = new Error(task.error || '生成失败');
                    error.terminal = true;
                    throw error;
                }
                if (status === 'unknown' && !task.external_task_id && !task.upstream_task_id) {
                    const error = new Error(task.error || '任务结果未知，系统不会自动重新提交；请点击“再次生成”创建新任务');
                    error.terminal = true;
                    throw error;
                }
            }
        }

        function showAngleResult(data, requestId) {
            if (latestGenerationRequestId !== requestId) return;
            currentResult = data;
            if (activeGenerationRequestId === requestId) {
                activeGenerationRequestId = '';
                sessionStorage.removeItem('angle_generation_request_id');
            }
            const outputImg = document.getElementById('outputImg');
            const downloadBtn = document.getElementById('downloadBtn');
            outputImg.src = data.images[0];
            outputImg.classList.remove('hidden');
            document.getElementById('loadingState').classList.add('hidden');
            downloadBtn.href = data.images[0];
            downloadBtn.classList.remove('hidden');
            downloadBtn.download = `Angle-${Date.now()}.png`;
            loadHistory();
        }

        async function restoreAngleGeneration() {
            const requestId = activeGenerationRequestId;
            if (!requestId) return;
            beginAngleGeneration(requestId);
            try {
                let task;
                let delay = 1500;
                while (true) {
                    try {
                        task = await apiJson(`/api/generation-tasks/by-request/${encodeURIComponent(requestId)}?operation=canvas-image`);
                        break;
                    } catch (error) {
                        if (error.status === 404) {
                            activeGenerationRequestId = '';
                            sessionStorage.removeItem('angle_generation_request_id');
                            return;
                        }
                        if (!error.retryable) throw error;
                        setAngleLoadingMessage('服务器连接中断，正在查找未完成任务…');
                        await wait(delay);
                        delay = Math.min(15000, delay * 2);
                    }
                }
                const data = String(task.status || '').toLowerCase() === 'succeeded'
                    ? angleTaskResult(task)
                    : await waitForAngleTask(task.id || task.task_id, requestId);
                if (!data.images?.length) throw new Error('任务已完成，但没有返回生成图片');
                showAngleResult(data, requestId);
            } catch (error) {
                console.error('恢复角度生成任务失败', error);
                if (error.terminal && activeGenerationRequestId === requestId) {
                    activeGenerationRequestId = '';
                    sessionStorage.removeItem('angle_generation_request_id');
                }
                if (latestGenerationRequestId === requestId) {
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('emptyState').classList.remove('hidden');
                    alert(error.message);
                }
            } finally {
                endAngleGeneration();
            }
        }

        async function handleGenerate(forceNew = false) {
            if (!uploadedReference?.url) {
                const dropzone = document.getElementById('dropzone');
                dropzone.style.transition = "0.2s";
                dropzone.style.borderColor = "#ef4444";
                dropzone.style.transform = "scale(0.98)";
                setTimeout(() => {
                    dropzone.style.borderColor = "";
                    dropzone.style.transform = "scale(1)";
                }, 300);
                return;
            }

            if (!provider || !selectedModel) {
                alert('请先在 API 设置中配置可用的生图平台和模型');
                return;
            }

            // Allow manual prompt even if angle not applied, but require prompt input
            if (!promptInput.value.trim()) {
                promptInput.style.transition = "0.2s";
                promptInput.style.borderColor = "#ef4444";
                setTimeout(() => {
                    promptInput.style.borderColor = "";
                }, 300);
                return;
            }

            if (forceNew) { activeGenerationRequestId = ''; sessionStorage.removeItem('angle_generation_request_id'); }
            const requestId = angleGenerationRequestId();
            beginAngleGeneration(requestId);

            try {
                const task = await apiJson('/api/canvas-image-tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: promptInput.value,
                        provider_id: provider,
                        model: selectedModel,
                        size: angleOutputSize(),
                        quality: 'auto',
                        n: outputCount,
                        type: 'angle',
                        request_id: requestId,
                        reference_images: [uploadedReference]
                    })
                });
                const taskId = task.task_id || task.id;
                if (!taskId) throw new Error('服务器没有返回任务编号');
                const data = await waitForAngleTask(taskId, requestId);
                showAngleResult(data, requestId);
            } catch (err) {
                console.error(err);
                if (err.terminal && activeGenerationRequestId === requestId) {
                    activeGenerationRequestId = '';
                    sessionStorage.removeItem('angle_generation_request_id');
                }
                if (latestGenerationRequestId === requestId) {
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('emptyState').classList.remove('hidden');
                }
                if (!err.silent && latestGenerationRequestId === requestId) {
                    alert(err.message);
                }
            } finally {
                endAngleGeneration();
            }
        }

        window.copyText = () => {
            const text = document.getElementById('generatedText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('#textResult button');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i> Copied`;
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    lucide.createIcons();
                }, 2000);
            });
        };

        // History Management
        function renderImageCard(data, isNew = false) {
            const masonry = document.getElementById('masonry');
            const imgUrl = data.images ? data.images[0] : '';
            if (!imgUrl) return;
            const thumbUrl = window.HistoryBulkManager?.previewUrl(imgUrl, 384) || imgUrl;

            const card = document.createElement('div');
            card.dataset.historyTs = data.timestamp;
            card.className = "masonry-item relative group cursor-pointer";

            card.onclick = () => { if(document.body.classList.contains('history-bulk-selecting')) return; openLightbox(imgUrl); };
            
            // ModelScope Badge
            const isCloud = data.is_cloud || (imgUrl && imgUrl.includes('cloud_angle'));
            const badgeHtml = isCloud ? `
                <div class="absolute top-3 left-3 z-10">
                    <img src="/static/images/modelscope.gif" class="h-4 w-auto object-contain bg-white/90 rounded-full p-0.5 shadow-sm">
                </div>
            ` : '';

            card.innerHTML = `
                <img src="${thumbUrl}" class="w-full h-full object-cover block transform group-hover:scale-105 transition-transform duration-[1.5s]" loading="lazy" decoding="async" fetchpriority="low">
                ${badgeHtml}
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-all duration-300 p-6 flex flex-col justify-end pointer-events-none">
                    <p class="text-white text-[10px] font-bold uppercase tracking-widest line-clamp-2">${data.prompt || "Angle Control"}</p>
                </div>
            `;

            if (isNew) masonry.prepend(card);
            else masonry.appendChild(card);
        }

        function loadNextPage() {
            const batch = allHistory.slice(currentIndex, currentIndex + PAGE_SIZE);
            if (batch.length === 0) {
                const el = document.getElementById('loadMoreTrigger');
                if (el) el.innerText = "End of Archive";
                return;
            }
            batch.forEach(item => renderImageCard(item, false));
            currentIndex += PAGE_SIZE;
        }

        async function loadHistory() {
            try {
                const history = await apiJson('/api/history?type=angle');
                if (history && Array.isArray(history)) {
                    allHistory = history;
                    document.getElementById('masonry').innerHTML = '';
                    currentIndex = 0;
                    loadNextPage();
                }
            } catch (e) { console.error(e); }
        }

        // Lightbox
        let lightboxPreview = null;
        function ensureLightboxPreview(){
            if(!lightboxPreview && window.StudioImagePreview){
                lightboxPreview = StudioImagePreview.attach(document.getElementById('lightboxFrame'));
            }
            return lightboxPreview;
        }
        function openLightbox(url) {
            const frame = document.getElementById('lightboxFrame');
            const img = document.getElementById('lightboxImg');
            const resPill = document.getElementById('lightboxRes');

            resPill.style.opacity = '0';
            ensureLightboxPreview();
            if(lightboxPreview) lightboxPreview.reset();
            img.src = url;

            const lb = document.getElementById('lightbox');
            lb.classList.replace('hidden', 'flex');
            frame.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            const updateRes = () => {
                if (img.naturalWidth) {
                    resPill.innerText = `${img.naturalWidth} x ${img.naturalHeight}`;
                    resPill.style.opacity = '1';
                }
            };

            img.onload = updateRes;
            if (img.complete) updateRes();
        }

        function closeLightbox() {
            if(lightboxPreview) lightboxPreview.reset();
            const lb = document.getElementById('lightbox');
            lb.classList.replace('flex', 'hidden');
            document.body.style.overflow = 'auto';
        }

        function handleOutsideClick(e) {
            if (e.target.id === 'lightbox') closeLightbox();
        }

        function downloadLightboxImage() {
            const imgUrl = document.getElementById('lightboxImg').src;
            const link = document.createElement('a');
            link.href = imgUrl;
            link.download = `Angle-Master-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function zoomImage() {
            if (currentResult && currentResult.images && currentResult.images[0]) {
                openLightbox(currentResult.images[0]);
            }
        }

        // Init
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && allHistory.length > 0) {
                loadNextPage();
            }
        }, { threshold: 0.1 });

        window.onload = () => {
            applyLanguage();
            refreshApiModels();
            loadHistory();
            restoreAngleGeneration();
            window.HistoryBulkManager?.attach({masonry:'#masonry'});
            observer.observe(document.getElementById('loadMoreTrigger'));
        };

        // WebSocket for real-time updates (optional but good for multi-tab sync)
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws/stats?client_id=${CLIENT_ID}`;
        const socket = new WebSocket(wsUrl);
        socket.onopen = () => {
            setInterval(() => {
                if (socket.readyState === WebSocket.OPEN) socket.send("ping");
            }, 30000);
        };
    </script>
</body>

</html>
