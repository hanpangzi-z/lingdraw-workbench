map $request_uri $linghui_static_cache_control {
    default                                      "public, max-age=3600";
    "~*\.html(?:\?|$)"                            "no-cache";
    "~*[?&]v=[^&]+"                                "public, max-age=31536000, immutable";
    "~*[._-][0-9a-f]{8,}\.(?:css|js|json|svg)"    "public, max-age=31536000, immutable";
}
